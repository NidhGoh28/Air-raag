<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Raag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3F0;--ink:#16151A;--soft:#76727E;--glass:rgba(255,255,255,.82);--line:rgba(22,21,26,.08);--L:#FF4F8B;--R:#16B3A3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#F1EEEA;}}
:root[data-theme="dark"]{--bg:#F1EEEA;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
video#vid{position:fixed;opacity:0;width:2px;height:2px;pointer-events:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;z-index:2}
.bar::-webkit-scrollbar{display:none}
.logo{font-weight:800;letter-spacing:-.03em;font-size:1.05rem;padding:0 6px;white-space:nowrap}
.logo span{color:var(--L)}
.seg{display:flex;background:var(--glass);border-radius:12px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none}
.seg button{font:inherit;font-weight:700;font-size:.82rem;border:0;background:transparent;color:var(--soft);border-radius:9px;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select,.pill{font:inherit;font-weight:700;font-size:.82rem;border:0;background:var(--glass);color:var(--ink);border-radius:12px;padding:9px 11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill.rec.on{background:#E5304B;color:#fff}
button:focus-visible,select:focus-visible{outline:3px solid var(--R);outline-offset:2px}
.legend{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;background:var(--glass);border-radius:14px;padding:9px 12px;font-size:.76rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;max-width:46vw}
.legend.l{left:10px}.legend.r{right:10px}
.legend h4{margin:0 0 3px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase}
.legend.l h4{color:var(--L)}.legend.r h4{color:var(--R)}
.legend div{display:flex;gap:8px;color:var(--soft)}.legend div b{color:var(--ink);min-width:34px}
.legend div.on{color:var(--ink);font-weight:800}.legend.l div.on b{color:var(--L)}.legend.r div.on b{color:var(--R)}
.touchpad{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:8px;padding:0 10px}
.touchpad.show{display:flex}
.keys{display:grid;gap:6px}
.keys button{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:14px;padding:13px 0 10px;background:var(--glass);color:var(--ink);cursor:pointer;line-height:1.1;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:none}
.keys button small{display:block;font-size:.64rem;font-weight:600;color:var(--soft)}
.keys button.on{background:var(--ink);color:#fff}.keys button.on small{color:#bbb}
.vol{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:14px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--soft)}
.vol input{flex:1;accent-color:var(--R)}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:5;background:rgba(245,243,240,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center}
.start.hide{display:none}
.start h1{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:-.05em;margin:0;line-height:1}
.start h1 span{color:var(--L)}
.start p{color:var(--soft);max-width:36ch;margin:0;line-height:1.5}
.go{width:92px;height:92px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:2rem;cursor:pointer;box-shadow:0 12px 30px rgba(22,21,26,.25)}
.alt{font:inherit;font-weight:700;border:0;background:transparent;color:var(--soft);text-decoration:underline;cursor:pointer}
.note{font-size:.82rem;color:var(--soft);min-height:1.2em}
.take{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:22px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.2);z-index:6;display:none}
.take.show{display:block}
.take video{width:100%;border-radius:12px;background:#000}
.take .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.take a{font-weight:800;color:var(--L)}
.take button{font:inherit;font-weight:700;border:0;background:#F1EEEA;border-radius:10px;padding:8px 12px;cursor:pointer}
</style>
</head>
<body>
<video id="vid" playsinline muted></video>
<canvas id="c"></canvas>
<div class="bar">
  <div class="logo">air<span>raag</span></div>
  <div class="seg" id="modeSeg"><button data-m="chords" aria-pressed="true">Chords</button><button data-m="raag" aria-pressed="false">Raag</button></div>
  <select id="key" aria-label="Key or Sa"></select>
  <select id="raag" aria-label="Raag"></select>
  <select id="voice" aria-label="Sound"></select>
  <button class="pill" id="drone" aria-pressed="false">Tanpura</button>
  <button class="pill rec" id="rec">● Rec</button>
</div>
<div class="legend l" id="legL"></div>
<div class="legend r" id="legR"></div>
<div class="touchpad" id="tp"><div class="keys" id="keys"></div><div class="vol">volume <input type="range" id="tvol" min="0" max="1" step=".01" value=".7"> tone <input type="range" id="ttone" min="0" max="1" step=".01" value=".6"></div></div>
<div class="take" id="take"><video id="takeVid" controls playsinline></video><div class="row"><a id="takeLink" download="air-raag.webm">Save video</a><button id="takeClose">Close</button></div></div>
<div class="start" id="start">
  <h1>air<span>raag</span></h1>
  <p>Play chords and raags in the air. Left hand picks what to play, right hand shapes how it sounds.</p>
  <button class="go" id="go" aria-label="Start with hand tracking">▶</button>
  <div class="note" id="note">Allow the camera. Keep both hands in view, in good light.</div>
  <button class="alt" id="touch">No camera? Play with touch</button>
</div>
<script type="module">
const $=id=>document.getElementById(id),cv=$("c"),ctx=cv.getContext("2d"),vid=$("vid");
let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",resize);resize();

/* ================= theory ================= */
const KEYN=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FLAT=["C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const MAJ=[0,2,4,5,7,9,11],ROM=["I","ii","iii","IV","V","vi","vii°"];
const RAAGS={bilawal:{n:"Bilawal",s:[0,2,4,5,7,9,11]},yaman:{n:"Yaman",s:[0,2,4,6,7,9,11]},bhairavi:{n:"Bhairavi",s:[0,1,3,5,7,8,10]},
  kafi:{n:"Kafi",s:[0,2,3,5,7,9,10]},khamaj:{n:"Khamaj",s:[0,2,4,5,7,9,10]},bhairav:{n:"Bhairav",s:[0,1,4,5,7,8,11]},bhupali:{n:"Bhupali",s:[0,2,4,7,9]}};
const SWAR={0:"Sa",1:"re",2:"Re",3:"ga",4:"Ga",5:"ma",6:"Ma'",7:"Pa",8:"dha",9:"Dha",10:"ni",11:"Ni"};
const VOICES=["Harmonium","Strings","Sitar","Santoor","Bansuri","Shehnai","Retro synth"];
let mode="chords",keyRoot=0,raag="yaman",voiceName="Harmonium",droneOn=false;
KEYN.forEach((k,i)=>$("key").insertAdjacentHTML("beforeend",`<option value="${i}">${k} · Sa</option>`));
Object.entries(RAAGS).forEach(([k,r])=>$("raag").insertAdjacentHTML("beforeend",`<option value="${k}">Raag ${r.n}</option>`));$("raag").value=raag;
VOICES.forEach(v=>$("voice").insertAdjacentHTML("beforeend",`<option>${v}</option>`));
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ================= audio ================= */
let A=null,master,tone,rev,recDest,noise;
function ac(){if(A){if(A.state==="suspended")A.resume();return A;}
  A=new (window.AudioContext||window.webkitAudioContext)();const comp=A.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(A.destination);
  try{recDest=A.createMediaStreamDestination();comp.connect(recDest);}catch(e){}
  master=A.createGain();master.gain.value=0;tone=A.createBiquadFilter();tone.type="lowpass";tone.frequency.value=4000;tone.Q.value=.7;master.connect(tone).connect(comp);
  rev=A.createConvolver();const sr=A.sampleRate,len=Math.floor(sr*2.4),ir=A.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.7);}
  rev.buffer=ir;const rg=A.createGain();rg.gain.value=.3;tone.connect(rev).connect(rg).connect(comp);
  noise=A.createBuffer(1,sr,sr);const nd=noise.getChannelData(0);for(let i=0;i<sr;i++)nd[i]=Math.random()*2-1;
  droneBus=A.createGain();droneBus.gain.value=0;droneBus.connect(comp);droneBus.connect(rev);
  buildVoices();return A;}
/* plucked strings, generated once per note and reused */
const ks=new Map();
function ksBuf(m,len=1.6,damp=.4985){const k=m+"_"+len;if(ks.has(k))return ks.get(k);const sr=A.sampleRate,N=Math.max(2,Math.round(sr/mtof(m))),L=Math.floor(sr*len),b=A.createBuffer(1,L,sr),d=b.getChannelData(0),ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;let p=0;for(let i=0;i<L;i++){const nx=(p+1)%N,v=ring[p];d[i]=v;ring[p]=(v+ring[nx])*damp;p=nx;}ks.set(k,b);return b;}
let lastPlucks=[];
function pluck(m,t,vol,kind){const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=ksBuf(m);
  if(kind==="Sitar"){f.type="peaking";f.frequency.value=1500;f.gain.value=10;f.Q.value=3;s.detune.setValueAtTime(35,t);s.detune.linearRampToValueAtTime(0,t+.08);}else{f.type="lowpass";f.frequency.value=7500;}
  g.gain.value=vol;s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+1.6);lastPlucks.push({s,t,base:0});if(lastPlucks.length>8)lastPlucks.shift();return s;}
const PLUCKED=v=>v==="Sitar"||v==="Santoor";
/* sustained voices: persistent oscillators that glide, so changes never click */
let voices=[],vib=null,vibDepth=null,benchVoice=null;
function buildVoices(){const n=A.currentTime;voices.forEach(v=>{v.g.gain.setTargetAtTime(0,n,.04);setTimeout(()=>v.nodes.forEach(o=>{try{o.stop()}catch(e){}}),300);});voices=[];
  if(!vib){vib=A.createOscillator();vib.frequency.value=5.4;vibDepth=A.createGain();vibDepth.gain.value=0;vib.connect(vibDepth);vib.start();}
  if(PLUCKED(voiceName))return;
  for(let i=0;i<4;i++){const g=A.createGain();g.gain.value=0;const nodes=[],oscs=[];let out;
    const mk=(type,det,vol)=>{const o=A.createOscillator(),og=A.createGain();o.type=type;o.detune.value=det;og.gain.value=vol;vibDepth.connect(o.detune);o.connect(og);o.start(n);nodes.push(o);oscs.push(o);return og;};
    if(voiceName==="Harmonium"){const f=A.createBiquadFilter();f.type="lowpass";f.frequency.value=2600;mk("square",-3,.4).connect(f);mk("sawtooth",3,.35).connect(f);out=f;}
    else if(voiceName==="Strings"){const f=A.createBiquadFilter();f.type="lowpass";f.frequency.value=1900;[-10,-3,4,11].forEach(d=>mk("sawtooth",d,.18).connect(f));out=f;}
    else if(voiceName==="Bansuri"){const f=A.createBiquadFilter();f.type="lowpass";f.frequency.value=3200;mk("sine",0,.8).connect(f);mk("triangle",0,.1).connect(f);out=f;
      const br=A.createBufferSource(),bf=A.createBiquadFilter(),bg=A.createGain();br.buffer=noise;br.loop=true;bf.type="bandpass";bf.frequency.value=2400;bf.Q.value=.8;bg.gain.value=.05;br.connect(bf).connect(bg).connect(g);br.start(n);nodes.push(br);}
    else if(voiceName==="Shehnai"){const hp=A.createBiquadFilter(),p1=A.createBiquadFilter(),p2=A.createBiquadFilter();hp.type="highpass";hp.frequency.value=420;p1.type="peaking";p1.frequency.value=1250;p1.gain.value=11;p1.Q.value=2;p2.type="peaking";p2.frequency.value=2900;p2.gain.value=7;p2.Q.value=2.5;
      mk("sawtooth",0,.5).connect(hp);mk("square",6,.3).connect(hp);hp.connect(p1).connect(p2);out=p2;}
    else{const f=A.createBiquadFilter();f.type="lowpass";f.frequency.value=2200;f.Q.value=4;mk("square",0,.35).connect(f);mk("sawtooth",-7,.25).connect(f);out=f;}
    const lvl=A.createGain();lvl.gain.value=voiceName==="Bansuri"?.3:voiceName==="Shehnai"?.17:voiceName==="Strings"?.16:.13;out.connect(lvl).connect(g);g.connect(master);
    voices.push({g,nodes,oscs});}
  if(voiceName==="Harmonium"){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=5.5;lg.gain.value=.025;voices.forEach(v=>l.connect(lg).connect(v.g.gain));l.start(n);voices[0].nodes.push(l);}}
/* tanpura: Pa Sa Sa Sa(low), plucked in a slow cycle */
let droneBus,droneTimer=null,droneNext=0,droneI=0;
function droneTick(){if(!droneOn)return;while(droneNext<A.currentTime+.2){const sa=48+keyRoot%12,pat=[sa-5,sa,sa,sa-12],m=pat[droneI%4];
  const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=ksBuf(m,4,.4997);f.type="peaking";f.frequency.value=1800;f.gain.value=8;f.Q.value=1.5;g.gain.value=droneI%4===3?.5:.38;
  s.connect(f).connect(g).connect(droneBus);s.start(droneNext);s.stop(droneNext+4);droneNext+=droneI%4===3?1.4:.7;droneI++;}}
function setDrone(on){droneOn=on;$("drone").setAttribute("aria-pressed",on);if(!A)return;droneBus.gain.setTargetAtTime(on?.55:0,A.currentTime,.3);if(on){droneNext=A.currentTime+.05;droneI=0;clearInterval(droneTimer);droneTimer=setInterval(droneTick,100);}else clearInterval(droneTimer);}

/* ================= what's sounding ================= */
let sounding=null; // {notes:[midi], label, sub, kind}
let santoorTimer=0;
function play(notes,changed){
  if(!A)return;const n=A.currentTime;
  if(!notes){voices.forEach(v=>v.g.gain.setTargetAtTime(0,n,.18));return;}
  if(PLUCKED(voiceName)){if(changed){const up=notes.slice().sort((a,b)=>a-b);up.forEach((m,i)=>pluck(m,n+i*(mode==="chords"?.028:0),mode==="chords"?.22:.34,voiceName));santoorTimer=0;}return;}
  voices.forEach((v,i)=>{const m=notes[i%notes.length]+(i>=notes.length?12:0);v.oscs.forEach(o=>o.frequency.setTargetAtTime(mtof(m),n,mode==="raag"?.06:.015));
    const on=i<notes.length||(mode==="chords"&&notes.length<4&&i===3&&false);v.g.gain.setTargetAtTime(i<notes.length?1:0,n,changed&&mode==="chords"?.02:.06);});}
function bend(semi){if(!A)return;const c=semi*100,n=A.currentTime;voices.forEach(v=>v.oscs.forEach(o=>o.detune.setTargetAtTime(c+(o.__d||0),n,.03)));lastPlucks.forEach(p=>p.s.detune.setTargetAtTime(c,n,.03));}

/* ================= hands ================= */
let hands=null,camOK=false,handsNow=[],lastVT=-1,input="none";
async function startCamera(){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});vid.srcObject=s;await vid.play();camOK=true;}
async function loadHands(){const T=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("t")),ms))]),V="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const m=await T(import(V),12000),fs=await T(m.FilesetResolver.forVisionTasks(V+"/wasm"),15000);
  hands=await T(m.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:.6,minTrackingConfidence:.55}),20000);}
function map(nx,ny){const vw=vid.videoWidth||640,vh=vid.videoHeight||480,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;return{x:(W-dw)/2+(1-nx)*dw,y:(H-dh)/2+ny*dh};}
function track(now){if(!hands||!camOK||vid.currentTime===lastVT)return;lastVT=vid.currentTime;let r;try{r=hands.detectForVideo(vid,now);}catch(e){return;}handsNow=(r.landmarks||[]).map(lm=>lm.map(p=>map(p.x,p.y)));}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function shape(lm){const up=([t,p])=>D(lm[t],lm[0])>D(lm[p],lm[0])*1.15;const f=[[8,6],[12,10],[16,14],[20,18]].map(up),palm=D(lm[0],lm[9]);
  const thumb=D(lm[4],lm[17])>D(lm[3],lm[17])*1.08&&D(lm[4],lm[5])>palm*.5,n=f.filter(Boolean).length;
  let g;if(n===0&&!thumb)g="fist";else if(n===0&&thumb)g="thumb";else if(thumb&&f[3]&&!f[0]&&!f[1]&&!f[2])g="shaka";else g=String(n===4&&thumb?5:n);
  const a=Math.atan2(lm[9].x-lm[0].x,-(lm[9].y-lm[0].y))*180/Math.PI;return{g,tilt:a};}
/* only accept a gesture once it's steady for several frames */
function stable(key,val,need=6,of=8){const q=stable[key]||(stable[key]=[]);q.push(val);if(q.length>of)q.shift();const c=q.filter(v=>v===val).length;if(c>=need)stable[key+"_v"]=val;return stable[key+"_v"];}

/* ================= mapping ================= */
const LCH=[["1","I"],["2","ii"],["3","iii"],["4","IV"],["5","V"],["thumb","vi"],["shaka","vii°"]];
const LSW=["1","2","3","4","5","thumb","shaka"];
let state={left:null,flip:false,vol:.7,toneV:.6,voicing:1,sapt:1,bend:0,present:{L:false,R:false},pending:false};
function chordNotes(deg,flip,voicing){const r=MAJ[deg],third=MAJ[(deg+2)%7]+12*Math.floor((deg+2)/7)-r,fifth=MAJ[(deg+4)%7]+12*Math.floor((deg+4)/7)-r,sev=MAJ[(deg+6)%7]+12*Math.floor((deg+6)/7)-r;
  let t=third;if(flip&&deg!==6)t=third===4?3:4;const root=48+keyRoot+r,base=[root,root+t,root+fifth];
  let notes=base;if(voicing===2)notes=[root+t,root+fifth,root+12];else if(voicing===3)notes=[root+fifth,root+12,root+12+t];else if(voicing===4)notes=[root,root+t,root+fifth,root+sev];else if(voicing>=5)notes=[root-12,root+fifth,root+12+t,root+19];
  while(notes[0]<52)notes=notes.map(m=>m+12);const q=deg===6&&!flip?"dim":t===4?"major":"minor";return{notes,name:FLAT[(keyRoot+r)%12]+(q==="minor"?"m":q==="dim"?"dim":""),q};}
const VOICING=["","root position","1st inversion","2nd inversion","with 7th","wide + octave"];
function update(now){
  let L=null,R=null;
  if(handsNow.length){const s=[...handsNow].sort((a,b)=>a[0].x-b[0].x);if(s.length>=2){L=s[0];R=s[s.length-1];}else(s[0][0].x<W/2?L=s[0]:R=s[0]);}
  state.present={L:!!L,R:!!R};
  if(R){const sh=shape(R),y=(R[0].y+R[9].y)/2;state.vol=Math.max(0,Math.min(1,1-(y-H*.12)/(H*.62)));state.toneV=Math.max(0,Math.min(1,(R[9].x-W*.5)/(W*.45)));
    const n=sh.g==="5"?5:sh.g==="fist"?0:+sh.g||1,sv=stable("R",n,5,7);
    if(mode==="chords")state.voicing=Math.max(1,sv||1);else state.sapt=sv>=3?2:sv===2?1:sv===1?0:1;
    state.bend=mode==="raag"?Math.max(-1.5,Math.min(1.5,sh.tilt/30*1.5)):0;}
  if(L){const sh=shape(L),g=stable("L",sh.g);state.flip=mode==="chords"&&sh.tilt<-22;
    if(g)state.left=g;}
  else if(!L&&input==="hands")state.left=state.left; // keep sounding when the hand briefly drops out
}
let lastKey="";
function resolve(){
  let notes=null,label="",sub="",cur=-1;
  if(mode==="chords"){const i=LCH.findIndex(([g])=>g===state.left);if(i>=0&&state.left!=="fist"){const c=chordNotes(i,state.flip,state.voicing);notes=c.notes;label=LCH[i][1]+(state.flip?"*":"");sub=`${c.name} ${c.q==="dim"?"diminished":c.q} · ${VOICING[state.voicing]}`;cur=i;}}
  else{const sc=RAAGS[raag].s,i=LSW.indexOf(state.left);if(i>=0&&i<sc.length){const semi=sc[i],m=48+keyRoot+semi+12*state.sapt;notes=[m];label=SWAR[semi];sub=`${FLAT[(keyRoot+semi)%12]} · ${["mandra","madhya","taar"][state.sapt]} saptak`;cur=i;}}
  const key=notes?notes.join(","):"";const changed=key!==lastKey;lastKey=key;
  play(notes,changed);if(A){master.gain.setTargetAtTime(notes?(.15+state.vol*.85):0,A.currentTime,.05);tone.frequency.setTargetAtTime(600+Math.pow(state.toneV,2)*7000,A.currentTime,.05);
    vibDepth&&vibDepth.gain.setTargetAtTime(mode==="raag"&&notes?(voiceName==="Shehnai"?18:10):0,A.currentTime,.2);bend(state.bend);}
  sounding=notes?{label,sub,cur}:null;renderLegends(cur);}
/* santoor tremolo: keeps re-striking while you hold a note */
setInterval(()=>{if(A&&sounding&&voiceName==="Santoor"&&lastKey){const ns=lastKey.split(",").map(Number);ns.forEach((m,i)=>pluck(m,A.currentTime+i*.02,.11,"Santoor"));}},190);

/* ================= legends ================= */
function renderLegends(cur){
  if(mode==="chords"){$("legL").innerHTML=`<h4>left hand · chord</h4>`+LCH.map(([g,r],i)=>{const c=chordNotes(i,false,1);return`<div class="${i===cur?"on":""}"><b>${{thumb:"👍",shaka:"🤙"}[g]||g+" ☝"}</b>${r} · ${c.name}</div>`;}).join("")+`<div><b>✊</b>silence · tilt out = flip</div>`;
    $("legR").innerHTML=`<h4>right hand · shape</h4><div class="on"><b>↕</b>volume ${Math.round(state.vol*100)}%</div><div class="on"><b>↔</b>tone ${Math.round(state.toneV*100)}%</div>`+[1,2,3,4,5].map(n=>`<div class="${state.voicing===n?"on":""}"><b>${n} ☝</b>${VOICING[n]}</div>`).join("");}
  else{const sc=RAAGS[raag].s;$("legL").innerHTML=`<h4>left hand · swar</h4>`+sc.map((s,i)=>`<div class="${i===cur?"on":""}"><b>${{thumb:"👍",shaka:"🤙"}[LSW[i]]||LSW[i]+" ☝"}</b>${SWAR[s]}</div>`).join("")+`<div><b>✊</b>rest</div>`;
    $("legR").innerHTML=`<h4>right hand · expression</h4><div class="on"><b>↕</b>volume ${Math.round(state.vol*100)}%</div><div class="on"><b>⟲</b>meend ${state.bend>=0?"+":""}${state.bend.toFixed(1)}</div>`+["mandra (low)","madhya","taar (high)"].map((s,i)=>`<div class="${state.sapt===i?"on":""}"><b>${i+1} ☝</b>${s}</div>`).join("");}}

/* ================= drawing (this is what gets recorded) ================= */
const BONES=[[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]];
function drawHand(lm,col){ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=3;
  for(const ch of BONES){ctx.beginPath();ch.forEach((k,i)=>i?ctx.lineTo(lm[k].x,lm[k].y):ctx.moveTo(lm[k].x,lm[k].y));ctx.stroke();}
  for(let k=0;k<21;k++){const tip=[4,8,12,16,20].includes(k);ctx.fillStyle=tip?col:"#fff";ctx.beginPath();ctx.arc(lm[k].x,lm[k].y,tip?6.5:3,0,7);ctx.fill();if(tip){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();}}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
let pop=0,lastLabel="";
function drawReadout(t){const cx=W/2,y=Math.max(70,H*.13),label=sounding?sounding.label:(input==="hands"&&!handsNow.length?"✋":"·"),sub=sounding?sounding.sub:(input==="hands"&&!handsNow.length?"show your hands":mode==="raag"?"left hand plays a swar":"left hand picks a chord");
  if(label!==lastLabel){pop=1;lastLabel=label;}pop*=.88;
  const big=Math.min(W*.2,96)*(1+pop*.08);ctx.font=`800 ${big}px Manrope, system-ui, sans-serif`;const lw=ctx.measureText(label).width;ctx.font=`600 15px Manrope, sans-serif`;const sw=ctx.measureText(sub).width;
  const w=Math.max(lw,sw)+56,h=big+52;ctx.fillStyle="rgba(255,255,255,.84)";rr(cx-w/2,y,w,h,24);ctx.fill();
  ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillStyle=mode==="raag"?"#FF4F8B":"#16151A";ctx.font=`800 ${big}px Manrope, system-ui, sans-serif`;ctx.fillText(label,cx,y+big*.95);
  ctx.fillStyle="#76727E";ctx.font=`600 15px Manrope, sans-serif`;ctx.fillText(sub,cx,y+big+30);
  if(mode==="raag"&&sounding){const bw=120,bx=cx-bw/2,by=y+h+10;ctx.fillStyle="rgba(255,255,255,.8)";rr(bx,by,bw,8,4);ctx.fill();ctx.fillStyle="#16B3A3";const px=cx+state.bend/1.5*bw/2;ctx.beginPath();ctx.arc(px,by+4,6,0,7);ctx.fill();}
  if(input==="hands"){ctx.textAlign="left";ctx.font="700 12px Manrope, sans-serif";ctx.fillStyle="rgba(22,21,26,.55)";ctx.fillText(`${KEYN[keyRoot]} · ${mode==="raag"?"Raag "+RAAGS[raag].n:"major key"} · ${voiceName}`,14,H-14);}}
let last=performance.now();
function frame(now){last=now;track(now);if(input==="hands")update(now);resolve();
  if(camOK&&vid.videoWidth){const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.max(W/vw,H/vh);ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s);ctx.restore();ctx.fillStyle="rgba(255,252,248,.14)";ctx.fillRect(0,0,W,H);}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#F7F4F0");g.addColorStop(1,"#ECE7F2");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(input==="hands"){const s=[...handsNow].sort((a,b)=>a[0].x-b[0].x);s.forEach((lm,i)=>drawHand(lm,(s.length===2?i===0:lm[0].x<W/2)?"#FF4F8B":"#16B3A3"));}
  if(input!=="none")drawReadout(now/1000);
  requestAnimationFrame(frame);}

/* ================= touch fallback ================= */
function renderKeys(){const k=$("keys");if(mode==="chords"){k.style.gridTemplateColumns="repeat(7,1fr)";k.innerHTML=LCH.map(([g,r],i)=>`<button data-i="${i}">${r}<small>${chordNotes(i,false,1).name}</small></button>`).join("");}
  else{const sc=RAAGS[raag].s;k.style.gridTemplateColumns=`repeat(${sc.length},1fr)`;k.innerHTML=sc.map((s,i)=>`<button data-i="${i}">${SWAR[s]}<small>${FLAT[(keyRoot+s)%12]}</small></button>`).join("");}
  k.querySelectorAll("button").forEach(b=>{b.onpointerdown=e=>{ac();b.setPointerCapture(e.pointerId);k.querySelectorAll("button").forEach(q=>q.classList.toggle("on",q===b));state.left=mode==="chords"?LCH[+b.dataset.i][0]:LSW[+b.dataset.i];b._y=e.clientY;};
    b.onpointermove=e=>{if(mode==="raag"&&b._y!=null)state.bend=Math.max(-1.5,Math.min(1.5,(b._y-e.clientY)/40));};
    b.onpointerup=b.onpointercancel=()=>{b._y=null;state.bend=0;if(mode==="raag"){state.left="fist";b.classList.remove("on");}};});}
$("tvol").oninput=e=>state.vol=+e.target.value;$("ttone").oninput=e=>state.toneV=+e.target.value;

/* ================= controls ================= */
function syncBar(){document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));$("raag").style.display=mode==="raag"?"":"none";renderKeys();}
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;state.left=null;lastKey="";if(mode==="raag"&&!droneOn&&A)setDrone(true);syncBar();});
$("key").onchange=e=>{keyRoot=+e.target.value;renderKeys();if(droneOn)setDrone(true);};
$("raag").onchange=e=>{raag=e.target.value;renderKeys();};
$("voice").onchange=e=>{voiceName=e.target.value;if(A){buildVoices();lastKey="";}};
$("drone").onclick=()=>{ac();setDrone(!droneOn);};
/* record a video of the stage with its sound */
let rec=null;
$("rec").onclick=()=>{if(rec){rec.stop();return;}ac();if(!cv.captureStream||!window.MediaRecorder){$("rec").textContent="Rec not supported";return;}
  const st=cv.captureStream(30);if(recDest)recDest.stream.getAudioTracks().forEach(t=>st.addTrack(t));
  const type=["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(st,type?{mimeType:type,videoBitsPerSecond:5e6}:undefined),chunks=[];mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{rec=null;$("rec").classList.remove("on");$("rec").textContent="● Rec";const b=new Blob(chunks,{type:mr.mimeType||"video/webm"}),url=URL.createObjectURL(b);
    $("takeVid").src=url;$("takeLink").href=url;$("takeLink").download="air-raag."+((mr.mimeType||"").includes("mp4")?"mp4":"webm");$("take").classList.add("show");};
  mr.start(250);rec=mr;$("rec").classList.add("on");$("rec").textContent="■ Stop";};
$("takeClose").onclick=()=>$("take").classList.remove("show");
$("go").onclick=async()=>{ac();$("note").textContent="Opening the camera…";
  try{await startCamera();}catch(e){$("note").textContent="Couldn't open the camera here. Play with touch, or open it from GitHub Pages.";return;}
  $("note").textContent="Loading hand tracking…";
  try{await loadHands();}catch(e){$("note").textContent="Hand tracking can't load here. Open it from GitHub Pages, or play with touch.";return;}
  input="hands";$("start").classList.add("hide");};
$("touch").onclick=()=>{ac();input="touch";$("start").classList.add("hide");$("tp").classList.add("show");$("legL").style.display="none";$("legR").style.display="none";};
syncBar();renderLegends(-1);requestAnimationFrame(frame);
</script>
</body>
</html>
